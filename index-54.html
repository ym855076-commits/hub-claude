a.l{color:var(--a);font-size:13px;font-weight:600;padding:6px 10px;border:1px solid var(--bd);border-radius:8px;text-decoration:none}
.note{font-size:12px;color:var(--sub);margin:8px 0 0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}

.tk .b{padding:4px 9px}
.row input{min-width:0}
.tk{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--bd);font-size:14px}
select{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:9px;font:inherit;font-size:14px;width:100%}
:focus-visible{outline:2px solid var(--g);outline-offset:2px}
.card h3{cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:17px;padding:2px 0}
.card h3::after{content:"\25BE";color:var(--sub);font-size:14px;transition:transform .2s}
.card.fold h3::after{transform:rotate(-90deg)}
.card.fold>*:not(h3){display:none}
.card{scroll-margin-top:64px;border-radius:16px;box-shadow:0 1px 2px rgba(0,0,0,.05);animation:cin .4s ease both}

textarea{min-height:64px}

.tk .b{min-height:36px}
.nv{position:sticky;top:0;z-index:5;display:flex;gap:8px;overflow-x:auto;padding:8px 0;margin:0 0 8px;background:var(--bg);scrollbar-width:none}

// ---- Таймер (Pomodoro 25/5, переживает перезагрузку) ----
let ts=null; // {mode:'work'|'rest', end:ms}
try{ts=JSON.parse(g('hub_timer'))}catch(e){}
let iv=null;
const pad=n=>String(n).padStart(2,'0');
function renderTimer(){
  const mode=ts?ts.mode:'work';
  $('fmode').textContent=t(mode);
  $('fb').textContent=ts?t('stop'):t('start');
  const rem=ts?Math.max(0,Math.ceil((ts.end-Date.now())/1000)):WORK;
  $('ft').textContent=pad(Math.floor(rem/60))+':'+pad(rem%60);
}
function tick(){
  if(ts&&Date.now()>=ts.end){
    const was=ts.mode;
    if(navigator.vibrate)navigator.vibrate([300,120,300]);
    ts={mode:was==='work'?'rest':'work',end:Date.now()+(was==='work'?REST:WORK)*1000};
    s('hub_timer',JSON.stringify(ts));
    $('fmode').textContent=t('done');
  }
  renderTimer();
}
function runTimer(){clearInterval(iv);iv=setInterval(tick,500)}
$('fb').onclick=()=>{
  if(ts){ts=null;s('hub_timer','null');clearInterval(iv)}
  else{ts={mode:'work',end:Date.now()+WORK*1000};s('hub_timer',JSON.stringify(ts));runTimer()}
  renderTimer();
};
if(ts)runTimer();
document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()});

// ---- Намаз (Aladhan API, кэш по дате) ----
let pdata=null;
function dateKey(){const d=new Date();return pad(d.getDate())+'-'+pad(d.getMonth()+1)+'-'+d.getFullYear()}
async function loadPrayer(){
  const key='hub_pt_'+dateKey();
  try{pdata=JSON.parse(g(key))}catch(e){}
  if(!pdata){
    try{
      const u=`https://api.aladhan.com/v1/timings/${dateKey()}?latitude=${LAT}&longitude=${LON}&method=${METHOD}&school=${SCHOOL}&timezonestring=${TZ}`;
      const r=await fetch(u);const j=await r.json();
      pdata=j.data.timings;s(key,JSON.stringify(pdata));
    }catch(e){}
  }
  renderPrayer();
}
function renderPrayer(){
  const box=$('pt');box.textContent='';
  if(!pdata){$('pinfo').textContent='Туркменабат · '+(navigator.onLine?t('loading'):t('offline'));return}
  $('pinfo').textContent='Туркменабат · '+dateKey().replace(/-/g,'.');
  const keys=['Fajr','Sunrise','Dhuhr','Asr','Maghrib','Isha'];
  const now=new Date(new Date().toLocaleString('en-US',{timeZone:TZ}));
  const nm=now.getHours()*60+now.getMinutes();
  let next=keys.findIndex(k=>{const[h,m]=pdata[k].split(':');return +h*60+ +m>nm});
  if(next<0)next=0;
  keys.forEach((k,i)=>{
    const d=document.createElement('div');if(i===next)d.className='nx';
    const b=document.createElement('b');b.textContent=pdata[k].slice(0,5);
    d.append(b,t('names')[i]);box.append(d);
  });
  renderDay();
}
loadPrayer();setInterval(renderPrayer,60000);

// ---- Аят дня (текст и перевод из alquran.cloud, кэш) ----
function ayIndex(){
  const day=Math.floor(Date.now()/86400000);
  return (day+ai)%AYAT.length;
}
async function loadAyah(){
  const ref=AYAT[ayIndex()],[sura,num]=ref.split(':');
  $('ref').textContent=`${sura}:${num}`;
  $('tf').href=`https://quran.com/${sura}:${num}/tafsirs`;
  $('an').value=g('hub_an_'+ref)||'';$('an').oninput=e=>s('hub_an_'+ref,e.target.value);
  let d=null;
  try{d=JSON.parse(g('hub_ay_'+ref))}catch(e){}
  if(!d){
    $('ar').textContent='';$('tr').textContent=t('loading');
    try{
      const r=await fetch(`https://api.alquran.cloud/v1/ayah/${ref}/editions/quran-uthmani,ru.kuliev`);
      const j=await r.json();
      d={ar:j.data[0].text,ru:j.data[1].text,name:j.data[1].surah.name};
      s('hub_ay_'+ref,JSON.stringify(d));
    }catch(e){$('tr').textContent=t('offline');return}
  }
  $('ar').textContent=d.ar;$('tr').textContent=d.ru;
}
$('nx').onclick=()=>{ai++;loadAyah()};

const TKD=['Ýekşenbe','Duşenbe','Sişenbe','Çarşenbe','Penşenbe','Anna','Şenbe'];
['ls','lc','lt','lg','lm','lo'].forEach(id=>{
  const e=$(id);e.value=g('hub_'+id)||'';e.oninput=e.onchange=()=>s('hub_'+id,e.value);
});
function fillKinds(){
  const sel=$('ls'),cur=sel.value||g('hub_ls')||'0';sel.textContent='';
  KINDS.forEach((k,i)=>{const o=document.createElement('option');o.value=i;o.textContent=lang==='ru'?k.ru+(k.tpl?'':' · '+k.tk):k.tk;sel.append(o)});
  sel.value=KINDS[+cur]?cur:'0';renderTf();
}
const auto={};
$('ls').addEventListener('change',()=>{
  renderTf();const k=KINDS[+$('ls').value];if(!k||k.tpl)return;
  [['lc',k.time],['lg',k.goal],['lm',k.equip]].forEach(([id,v])=>{
    const e=$(id);if(!e.value||e.value===auto[id]){e.value=v||'';auto[id]=e.value;s('hub_'+id,e.value)}
  });
});
const curKind=()=>KINDS[+$('ls').value||0];
function renderTf(){
  const k=curKind(),box=$('pf'),tpl=!!k.tpl;
  $('fe').hidden=tpl;$('lc').hidden=tpl;$('ls').style.gridColumn=tpl?'1/-1':'';
  box.textContent='';
  const names=tpl?[...new Set([...k.tpl.join('\n').matchAll(/\{\{([^}]+)\}\}/g)].map(m=>m[1]))]:[];
  box.hidden=!names.length;
  names.forEach(n=>{
    const i=document.createElement('input');i.placeholder=n;i.value=g('hub_tf_'+n)||'';i.style.marginBottom='8px';
    i.oninput=()=>s('hub_tf_'+n,i.value);box.append(i);
  });
}
function dayLine(){
  const d=new Date();
  return pad(d.getDate())+'.'+pad(d.getMonth()+1)+'.'+String(d.getFullYear()).slice(2)+' ý. '+TKD[d.getDay()]+' güni';
}
function lessonText(){
  const k=curKind(),dl=dayLine(),end=['',`Barlandy: ________   ${dl.split(' ')[0]}`];
  if(k.tpl){const body=k.tpl.join('\n\n').replace(/\{\{([^}]+)\}\}/g,(m,n)=>(g('hub_tf_'+n)||'').trim()||'________');return [dl,'',body,...end].join('\n')}
  const v=id=>$(id).value.trim()||'________',tm=$('lc').value.trim();
  const out=[dl,'',(tm?tm+' ':'')+k.tk,`Tema: ${v('lt')}`,`Maksady: ${v('lg')}`,`Esbaby: ${v('lm')}`];
  if(k.steps){out.push('','Gidişi:');k.steps.forEach(([a,b],i)=>out.push(`${i+1}) ${a}:`,'   '+(b||'________').replace(/\n/g,'\n   ')))}
  if(k.extra)out.push('',k.extra);
  return out.concat(end).join('\n');
}
function aiPromptText(){
  const k=curKind(),v=id=>$(id).value.trim()||'—',tm=$('lc').value.trim();
  if(k.tpl)return '';
  return [t('pin'),k.tk+(tm?' ('+tm+')':''),`${t('ltopic')}: ${v('lt')}`,`${t('lgoalL')}: ${v('lg')}`,`${t('lequipL')}: ${v('lm')}`,
    t('lcourse')+': '+(k.steps?k.steps.map(x=>x[0]).join(' → '):'')+'.',t('pout')].join('\n');
}
$('lb').onclick=()=>{const x=lessonText();$('lo').value=x;s('hub_lo',x)};
$('lp').onclick=async()=>{
  const x=aiPromptText();
  if(!x){alert(t('noPrompt'));return}
  try{await navigator.clipboard.writeText(x);$('lp').textContent=t('copied');setTimeout(()=>$('lp').textContent=t('aiPrompt'),1500)}
  catch(e){prompt('',x)}
};
$('lx').onclick=()=>{
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([$('lo').value],{type:'text/plain;charset=utf-8'}));
  a.download='meyilnama.txt';document.body.appendChild(a);a.click();a.remove();
};
$('lcp').onclick=async()=>{
  const x=$('lo').value;if(!x)return;
  try{await navigator.clipboard.writeText(x);$('lcp').textContent=t('copied');setTimeout(()=>$('lcp').textContent=t('copyBtn'),1500)}
  catch(e){prompt('',x)}
};

// ---- ИИ-помощник (через Netlify Function) ----
['aip','aic','aiu','aiq','aia'].forEach(id=>{
  const e=$(id);
  e.value=g('hub_'+id)||(id==='aiu'&&/netlify\.app$/.test(location.hostname)?location.origin:(id==='aip'?'claude':''));
  e.oninput=e.onchange=()=>s('hub_'+id,e.value);
});
if(!$('aip').value){$('aip').value='claude';s('hub_aip','claude')}
async function askAI(prompt,target,btn){
  const base=$('aiu').value.trim().replace(/\/$/,''),code=$('aic').value;
  if(!prompt)return;
  if(!base||!code){alert(t('aiSetup'));return}
  btn.disabled=true;btn.textContent=t('loading');
  try{
    const r=await fetch(base+'/api/ai',{method:'POST',headers:{'Content-Type':'application/json','X-Access-Code':code},body:JSON.stringify({provider:$('aip').value,prompt})});
    const j=await r.json();
    if(!r.ok)throw new Error(j.error||r.status);
    target.value=j.text;s('hub_'+target.id,j.text);
  }catch(e){alert(t('aiErr')+' '+e.message)}
  btn.disabled=false;btn.textContent=t(btn.dataset.i);
}
$('aib').onclick=()=>askAI($('aiq').value.trim(),$('aia'),$('aib'));

// ---- Мой день / Сад идей / Сундучок ----
const nid=()=>Date.now()*1000+Math.floor(Math.random()*1000);
function esc(x){return String(x).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
var DY=null,GD=[],gf='';
try{DY=JSON.parse(g('hub_day'))}catch(e){}
if(!DY||typeof DY!=='object')DY={date:'',items:[]};
if(!Array.isArray(DY.items))DY.items=[];
try{GD=JSON.parse(g('hub_garden'))||[]}catch(e){}
if(!Array.isArray(GD))GD=[];
const dsave=()=>s('hub_day',JSON.stringify(DY));
const gsave=()=>s('hub_garden',JSON.stringify(GD));
function renderDay(){
  if(!DY||!$('dls'))return;
  const k=dateKey();
  if(DY.date!==k){DY={date:k,items:DY.items.filter(i=>!i.x)};dsave()}
  const n=document.querySelector('#pt .nx');let pr='';
  if(n&&n.querySelector('b')){const tm=n.querySelector('b').textContent;pr=n.textContent.replace(tm,'').trim()+' '+tm}
  $('dsub').textContent=DY.date.replace(/-/g,'.')+(pr?' · '+t('dayNext')+': '+pr:'');
  const m=($('shift').value||'').trim();
  $('dmain').textContent=m?'📌 '+m:'';$('dmain').hidden=!m;
  $('dls').innerHTML=DY.items.map(i=>`<label class="tk"><input type="checkbox" data-ck="${i.id}"${i.x?' checked':''}><span style="flex:1;${i.x?'text-decoration:line-through;color:var(--sub)':''}">${esc(i.t)}</span><button class="b" data-rm="${i.id}" aria-label="delete">✕</button></label>`).join('');
  const done=DY.items.filter(i=>i.x).length;
  $('dprog').textContent=DY.items.length?t('dayDone')+': '+done+' / '+DY.items.length:t('dayEmpty');
  renderWeek();
}
$('dadd').onclick=()=>{const x=$('dn').value.trim();if(!x)return;DY.items.push({id:nid(),t:x,x:false});dsave();$('dn').value='';renderDay()};
$('dn').onkeydown=e=>{if(e.key==='Enter')$('dadd').click()};
$('dls').onclick=e=>{const r=e.target.closest('[data-rm]');if(r){DY.items=DY.items.filter(v=>String(v.id)!==r.dataset.rm);dsave();renderDay()}};
$('dls').onchange=e=>{const c=e.target.closest('[data-ck]');if(!c)return;const i=DY.items.find(v=>String(v.id)===c.dataset.ck);if(i){i.x=c.checked;dsave();logDone();renderDay()}};
$('shift').addEventListener('input',renderDay);
setInterval(renderDay,60000);

function gparse(x){return x.split(/[,#\s]+/).map(v=>v.trim().toLowerCase()).filter(Boolean).slice(0,6)}
function renderGarden(){
  if(!$('gl'))return;
  const q=$('gs').value.trim().toLowerCase().replace('#','');
  const tags=[...new Set(GD.flatMap(i=>i.tags))].sort();
  if(gf&&!tags.includes(gf))gf='';
  $('gtags').innerHTML=tags.map(x=>`<button class="b${x===gf?' p':''}" style="padding:6px 10px" data-tg="${esc(x)}">#${esc(x)}</button>`).join('');
  const list=GD.filter(i=>(!gf||i.tags.includes(gf))&&(!q||i.t.toLowerCase().includes(q)||i.tags.some(x=>x.includes(q))));
  $('gl').innerHTML=list.map(i=>`<div class="tk"><div style="flex:1;min-width:0"><div>${esc(i.t).replace(/\n/g,'<br>')}</div><div class="note" style="margin:2px 0 0">${i.tags.map(x=>'#'+esc(x)).join(' ')} · ${new Date(i.d).toLocaleDateString('ru-RU')}</div></div><button class="b" data-cp="${i.id}" aria-label="copy">⧉</button><button class="b" data-ai="${i.id}" aria-label="AI">✨</button><button class="b" data-dl="${i.id}" aria-label="delete">✕</button></div>`).join('');
  $('gcnt').textContent=t('gardenCnt')+': '+list.length+' / '+GD.length;
}
$('ga').onclick=()=>{const x=$('gi').value.trim();if(!x)return;GD.unshift({id:nid(),t:x,tags:gparse($('gtg').value),d:Date.now()});gsave();$('gi').value='';$('gtg').value='';renderGarden()};
$('gs').oninput=renderGarden;
$('gtags').onclick=e=>{const b=e.target.closest('[data-tg]');if(!b)return;gf=gf===b.dataset.tg?'':b.dataset.tg;renderGarden()};
$('gl').onclick=e=>{
  const c=e.target.closest('[data-cp]'),a=e.target.closest('[data-ai]'),d=e.target.closest('[data-dl]');
  const find=id=>GD.find(v=>String(v.id)===id);
  if(c){const i=find(c.dataset.cp);if(i&&navigator.clipboard)navigator.clipboard.writeText(i.t).catch(()=>{});c.textContent='✓';setTimeout(()=>{c.textContent='⧉'},900)}
  if(a){const i=find(a.dataset.ai);if(i){$('aiq').value=i.t;s('hub_aiq',i.t);$('c-ai').classList.remove('fold');$('aiq').scrollIntoView({behavior:'smooth',block:'center'})}}
  if(d&&confirm(t('gardenDel'))){GD=GD.filter(v=>String(v.id)!==d.dataset.dl);gsave();renderGarden()}
};

$('bk').onclick=()=>{
  const o={};
  try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k.startsWith('hub_')&&k!=='hub_aic')o[k]=localStorage.getItem(k)}}catch(e){}
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify({app:'yusup-hub',v:1,at:new Date().toISOString(),data:o})],{type:'application/json'}));
  a.download='hub-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();
};
$('rs').onclick=()=>$('rf').click();
$('rf').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  f.text().then(x=>{
    try{
      const j=JSON.parse(x);if(j.app!=='yusup-hub'||!j.data)throw 0;
      if(!confirm(t('bkAsk')))return;
      Object.keys(j.data).forEach(k=>{if(k.startsWith('hub_')&&k!=='hub_aic')s(k,j.data[k])});
      location.reload();
    }catch(err){alert(t('bkBad'))}
  });
  e.target.value='';
};

var ti=0;
function tipIdx(a){return (Math.floor(Date.parse(dateKey())/86400000)+ti)%a.length}
function renderTip(){
  if(!$('tipx'))return;
  const a=t('tips');$('tipx').textContent=a[tipIdx(a)];
}
$('tnx').onclick=()=>{ti++;renderTip()};
$('tsv').onclick=()=>{
  const a=t('tips'),x=a[tipIdx(a)];
  if(!GD.some(i=>i.t===x)){GD.unshift({id:nid(),t:x,tags:[lang==='tk'?'maslahat':'совет'],d:Date.now()});gsave();renderGarden()}
  $('tsv').textContent=t('tipSaved');setTimeout(()=>{$('tsv').textContent=t('tipSave')},1200);
};

var ci=0;
function clIdx(a){return (Math.floor(Date.parse(dateKey())/86400000)+ci)%a.length}
function renderIdea(){
  if(!$('clx'))return;
  const a=t('ideas');$('clx').textContent=a[clIdx(a)];
}
$('cnx').onclick=()=>{ci++;renderIdea()};
$('csv').onclick=()=>{
  const a=t('ideas'),x=a[clIdx(a)];
  if(!GD.some(i=>i.t===x)){GD.unshift({id:nid(),t:x,tags:['claude'],d:Date.now()});gsave();renderGarden()}
  $('csv').textContent=t('tipSaved');setTimeout(()=>{$('csv').textContent=t('tipSave')},1200);
};
$('cai').onclick=()=>{$('aiq').value=t('clPrompt');s('hub_aiq',t('clPrompt'));$('c-ai').classList.remove('fold');$('aiq').scrollIntoView({behavior:'smooth',block:'center'})};

function logDone(){
  let st={};try{st=JSON.parse(g('hub_stats'))||{}}catch(e){}
  st[DY.date]=DY.items.filter(i=>i.x).length;
  const ks=Object.keys(st).sort();while(ks.length>60)delete st[ks.shift()];
  s('hub_stats',JSON.stringify(st));
}
function renderWeek(){
  if(!$('wk'))return;
  let st={};try{st=JSON.parse(g('hub_stats'))||{}}catch(e){}
  const base=Date.parse(dateKey()),days=[];
  for(let n=6;n>=0;n--){const ms=base-n*86400000;days.push({k:new Date(ms).toISOString().slice(0,10),w:new Date(ms).getUTCDay(),today:n===0})}
  const vals=days.map(d=>+st[d.k]||0),max=Math.max(1,...vals),total=vals.reduce((a,b)=>a+b,0);
  $('wk').innerHTML=days.map((d,i)=>`<div style="flex:1;text-align:center;font-size:11px;color:var(--sub)"><div>${vals[i]||''}</div><div style="height:${Math.max(4,Math.round(vals[i]/max*56))}px;background:${d.today?'var(--a)':'var(--bd)'};border-radius:6px;margin:2px 0"></div><div>${t('wd')[d.w]}</div></div>`).join('');
  $('wkt').textContent=total?t('weekTotal')+': '+total+' · '+t('weekBest')+': '+max:t('weekEmpty');
}
// ---- конец ----
// ---- Навигация и сворачивание карточек ----
$('nv').onclick=e=>{
  const b=e.target.closest('[data-go]');if(!b)return;
  const c=$(b.dataset.go);if(!c)return;
  c.classList.remove('fold');c.scrollIntoView({behavior:'smooth',block:'start'});
};
const cards=[...document.querySelectorAll('.card')];
let fold=[];try{fold=JSON.parse(g('hub_fold'))||[]}catch(e){}
cards.forEach((c,i)=>{
  const h=c.querySelector('h3');if(!h)return;
  h.tabIndex=0;h.setAttribute('role','button');
  const set=f=>{c.classList.toggle('fold',f);h.setAttribute('aria-expanded',String(!f))};
  set(fold.includes(i));
  const tg=()=>{set(!c.classList.contains('fold'));s('hub_fold',JSON.stringify(cards.map((x,j)=>x.classList.contains('fold')?j:-1).filter(j=>j>=0)))};
  h.onclick=tg;
  h.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();tg()}};
});

const ZS=[1,1.1,1.2,1.3];let zi=+g('hub_zoom')||0;if(!(zi>=0&&zi<ZS.length))zi=0;
const zap=()=>{document.body.style.zoom=ZS[zi]};zap();
$('zm').onclick=()=>{zi=(zi+1)%ZS.length;s('hub_zoom',zi);zap()};

applyLang();loadAyah();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
