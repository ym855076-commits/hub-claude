<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yusup Hub</title>
<style>
:root{--bg:#f3f1ec;--card:#fffdf9;--tx:#2b2b28;--sub:#6b6a64;--bd:#ded9cf;--g:#1f6b4a}
body.dark{--bg:#14171a;--card:#1c2024;--tx:#e6e4de;--sub:#a3a199;--bd:#2f353b;--g:#5fbf93}
*{box-sizing:border-box}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);margin:0;padding:14px;line-height:1.45}
.c{max-width:500px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--bd);border-left:4px solid var(--a,#1976d2);border-radius:12px;padding:16px;margin-bottom:14px}
.card h3{margin:0 0 4px;font-size:16px;color:var(--a)}
.sub{font-size:12px;color:var(--sub);margin:0 0 10px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:14px}
.top h1{font-size:19px;margin:0}
.top button,.b{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:8px 12px;font-size:13px;font-weight:600;cursor:pointer}
.top button.on{background:var(--g);color:#fff;border-color:var(--g)}
.b.p{background:var(--a);color:#fff;border-color:var(--a)}
.row{display:flex;gap:8px;flex-wrap:wrap}
input,textarea{width:100%;background:transparent;color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:9px;font:inherit;font-size:14px}
textarea{height:80px;resize:vertical}
.big{font-size:38px;font-weight:700;text-align:center;color:var(--a);margin:4px 0 10px;font-variant-numeric:tabular-nums}
.ar{font-family:"Amiri","Traditional Arabic","Scheherazade New",serif;font-size:26px;line-height:2;text-align:right;direction:rtl;color:var(--g);margin:0 0 8px}
.pt{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pt div{border:1px solid var(--bd);border-radius:8px;padding:6px;text-align:center;font-size:12px;color:var(--sub)}
.pt b{display:block;font-size:16px;color:var(--tx)}
.pt .nx{border-color:var(--a);background:rgba(31,107,74,.1)}
a.l{color:var(--a);font-size:13px;font-weight:600;padding:6px 10px;border:1px solid var(--bd);border-radius:8px;text-decoration:none}
.note{font-size:12px;color:var(--sub);margin:8px 0 0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.bm{text-align:center;font-family:"Amiri","Traditional Arabic",serif;font-size:22px;color:var(--g);border:1px solid var(--bd);background:var(--card);border-radius:12px;padding:10px;margin-bottom:14px}
[hidden]{display:none!important}
input[type=checkbox]{width:22px;height:22px;flex:none;margin:0}
.tk{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--bd);font-size:14px}
select{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:9px;font:inherit;font-size:14px;width:100%}
:focus-visible{outline:2px solid var(--g);outline-offset:2px}
</style>
</head>
<body>
<div class="c">

<div class="top">
  <h1 id="hello"></h1>
  <div class="row">
    <button id="thm" aria-label="Theme">🌙</button>
    <button id="bru" data-l="ru">RU</button>
    <button id="btk" data-l="tk">TK</button>
  </div>
</div>

<div class="bm">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div>

<div class="card" style="--a:#1f6b4a">
  <h3 data-i="prayer"></h3>
  <p class="sub" id="pinfo"></p>
  <div class="pt" id="pt"></div>
  <p class="note" data-i="pnote"></p>
</div>

<div class="card" style="--a:#1976d2">
  <h3 data-i="task"></h3>
  <input id="shift" data-p="taskPh">
</div>

<div class="card" style="--a:#00796b">
  <h3 data-i="focus"></h3>
  <p class="sub" id="fmode"></p>
  <div class="big" id="ft">25:00</div>
  <div class="row"><button class="b p" id="fb" style="flex:1"></button></div>
</div>

<div class="card" style="--a:#1f6b4a">
  <h3 data-i="quran"></h3>
  <p class="sub" id="ref"></p>
  <p class="ar" id="ar"></p>
  <p id="tr" style="margin:0 0 10px"></p>
  <textarea id="an" data-p="ayPh" style="height:60px"></textarea>
  <div class="row" style="margin-top:8px">
    <button class="b p" id="nx" data-i="next"></button>
    <a class="l" id="tf" target="_blank" rel="noopener" data-i="tafsir"></a>
  </div>
  <p class="note" data-i="qnote"></p>
</div>

<div class="card" style="--a:#d1453b">
  <h3 data-i="todo"></h3>
  <div id="tsetup">
    <input id="tok" type="password" data-p="tokPh" autocomplete="off" style="margin-bottom:8px">
    <button class="b p" id="tsave" data-i="save"></button>
  </div>
  <div id="tview" hidden>
    <div id="tl"></div>
    <p class="note" id="tmsg"></p>
    <div class="row" style="margin-top:8px"><button class="b" id="tref" data-i="refresh"></button><button class="b" id="tch" data-i="change"></button></div>
  </div>
</div>

<div class="card" style="--a:#3949ab">
  <h3 data-i="macro"></h3>
  <input id="dev" data-p="devPh" autocomplete="off" style="margin-bottom:8px">
  <div class="row" id="mb"></div>
  <div class="row" style="margin-top:8px"><button class="b" id="mad" data-i="addBtn"></button></div>
  <p class="note" data-i="macroHint"></p>
</div>

<div class="card" style="--a:#00838f">
  <h3 data-i="ai"></h3>
  <div class="g2"><select id="aip"><option value="claude">Claude</option><option value="gemini">Gemini</option></select><input id="aic" type="password" data-p="aiCode" autocomplete="off"></div>
  <input id="aiu" data-p="aiUrl" style="margin-bottom:8px">
  <textarea id="aiq" data-p="aiQ" style="height:70px;margin-bottom:8px"></textarea>
  <div class="row"><button class="b p" id="aib" data-i="ask"></button></div>
  <textarea id="aia" data-p="aiA" style="height:160px;margin-top:8px"></textarea>
</div>

<div class="card" style="--a:#b45309">
  <h3 data-i="lesson"></h3>
  <div class="g2"><input id="ls" data-p="lsubj"><input id="lc" data-p="lclass"></div>
  <input id="lt" data-p="ltopic" style="margin-bottom:8px">
  <div class="g2"><input id="lg" data-p="lgoal"><input id="lm" type="number" inputmode="numeric" min="10" max="120" data-p="lmin"></div>
  <textarea id="lo" data-p="lph" style="height:210px;margin-bottom:8px"></textarea>
  <div class="row"><button class="b p" id="lb" data-i="build"></button><button class="b" id="lp" data-i="aiPrompt"></button><button class="b" id="lx" data-i="exp"></button><button class="b" id="lai" data-i="aiLesson"></button></div>
</div>

<div class="card" style="--a:#7b5ea7">
  <h3 data-i="notes"></h3>
  <textarea id="nt" data-p="notePh"></textarea>
  <div class="row" style="margin-top:8px">
    <button class="b" id="ex" data-i="exp"></button>
    <button class="b" id="im" data-i="imp"></button>
    <input type="file" id="fi" accept=".txt,text/plain" hidden>
  </div>
</div>

</div>
<script>
const $=id=>document.getElementById(id);
const g=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const s=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};

// ---- Настройки ----
const LAT=39.0733, LON=63.5786, TZ='Asia/Ashgabat';
const METHOD=13, SCHOOL=1; // 13 = Diyanet, SCHOOL 1 = ханафитский аср. Сверь со своей таблицей!
const WORK=25*60, REST=5*60;
const AYAT=['65:3','94:6','2:152','13:28','2:286','3:139','39:53'];

const T={
ru:{hello:'Привет, Юсуп!',prayer:'🕌 Время намаза',pnote:'Расчёт по методу из настроек кода. Сверяй с местной таблицей.',
task:'📌 Главная задача',taskPh:'Например: утренняя смена, дописать бота',
focus:'⏱️ Фокус',work:'Работа 25 минут',rest:'Перерыв 5 минут',start:'Начать',stop:'Остановить',
done:'Время вышло!',quran:'📖 Аят дня',next:'Другой аят',tafsir:'Тафсир ↗',ayPh:'Мои мысли об аяте (только для тебя)…',
qnote:'Текст и перевод (Кулиев) загружаются из открытой базы. Толкование смотри у богословов, не у ИИ.',
links:'🚀 Мои ссылки',addLink:'+ Добавить ссылку',notes:'📓 Заметки',notePh:'Записать идею…',exp:'📥 Скачать .txt',imp:'📤 Загрузить',
lesson:'📝 Конспект урока',lsubj:'Предмет',lclass:'Класс',ltopic:'Тема урока',lgoal:'Цель урока',lmin:'Минут',build:'Собрать конспект',aiPrompt:'Промпт для ИИ',copied:'Скопировано ✓',lph:'Здесь появится конспект. Его можно править.',
stages:['Организационный момент','Проверка домашнего задания','Изучение нового материала','Закрепление','Итоги и домашнее задание'],lhead:'КОНСПЕКТ УРОКА',lgoalL:'Цель',ltasks:'Задачи',lequip:'Оборудование',lcourse:'Ход урока',lmin_:'мин',
pin:'Составь подробный конспект урока.',pout:'Пиши простым понятным языком, добавь вопросы ученикам, примеры и домашнее задание.',
todo:'✅ Задачи на сегодня',tokPh:'Токен Todoist',save:'Сохранить',refresh:'Обновить',change:'Сменить токен',noTasks:'На сегодня задач нет 🎉',todoErr:'Не удалось загрузить. Проверь токен и сеть.',
macro:'⚙️ Автоматизация (MacroDroid)',devPh:'ID устройства MacroDroid',addBtn:'+ Кнопка',btnName:'Название кнопки',btnId:'Идентификатор Webhook-триггера (как в MacroDroid)',sent:'Отправлено ✓',macroHint:'Кнопка вызывает Webhook-триггер с таким идентификатором. Удалить кнопку: долгое нажатие.',
ai:'✨ ИИ-помощник',aiCode:'Код доступа',aiUrl:'Адрес сайта на Netlify (https://…netlify.app)',aiQ:'Вопрос или задание для ИИ…',aiA:'Ответ ИИ появится здесь',ask:'Спросить',aiLesson:'✨ ИИ',aiSetup:'Укажи адрес сайта и код доступа.',aiErr:'Ошибка ИИ:',
loading:'Загрузка…',offline:'Нет сети и нет сохранённой копии.',next_:'След.',linkName:'Название ссылки',linkUrl:'Адрес (https://…)',
names:['Фаджр','Восход','Зухр','Аср','Магриб','Иша']},
tk:{hello:'Salam, Ýusup!',prayer:'🕌 Namaz wagtlary',pnote:'Hasaplama koddaky usul boýunça. Ýerli tablisa bilen deňeşdiriň.',
task:'📌 Esasy iş',taskPh:'Meselem: irden çalşyk, bot ýazmak',
focus:'⏱️ Üns',work:'Iş 25 minut',rest:'Arakesme 5 minut',start:'Başla',stop:'Bes et',
done:'Wagt gutardy!',quran:'📖 Günüň aýaty',next:'Başga aýat',tafsir:'Tefsir ↗',ayPh:'Aýat barada pikirlerim (diňe özüm üçin)…',
qnote:'Aýat we terjime (rusça, Kuliýew) açyk bazadan ýüklenýär. Düşündirişi alymlardan alyň.',
links:'🚀 Baglanyşyklarym',addLink:'+ Baglanyşyk goş',notes:'📓 Bellikler',notePh:'Pikir ýazyň…',exp:'📥 .txt ýükle',imp:'📤 Faýl aç',
lesson:'📝 Sapak konspekti',lsubj:'Predmet',lclass:'Synp',ltopic:'Sapagyň temasy',lgoal:'Sapagyň maksady',lmin:'Minut',build:'Konspekt düz',aiPrompt:'AI üçin prompt',copied:'Göçürildi ✓',lph:'Konspekt şu ýerde peýda bolar. Redaktirläp bolýar.',
stages:['Guramaçylyk pursaty','Öý işini barlamak','Täze materialy öwrenmek','Berkitmek','Jemleme we öý işi'],lhead:'SAPAK KONSPEKTI',lgoalL:'Maksat',ltasks:'Wezipeler',lequip:'Enjamlar',lcourse:'Sapagyň barşy',lmin_:'min',
pin:'Sapagyň jikme-jik konspektini düz.',pout:'Düşnükli, ýönekeý dilde ýaz, okuwçylar üçin soraglar, mysallar we öý işini goş.',
todo:'✅ Şu günki işler',tokPh:'Todoist tokeni',save:'Ýatda sakla',refresh:'Täzele',change:'Tokeni çalyş',noTasks:'Şu gün iş ýok 🎉',todoErr:'Ýüklenmedi. Tokeni we ulgamy barlaň.',
macro:'⚙️ Awtomatlaşdyryş (MacroDroid)',devPh:'MacroDroid enjam ID',addBtn:'+ Düwme',btnName:'Düwmäniň ady',btnId:'Webhook-trigger identifikatory (MacroDroid-daky ýaly)',sent:'Iberildi ✓',macroHint:'Düwme şol identifikatorly Webhook-triggeri çagyrýar. Pozmak: uzak basyň.',
ai:'✨ AI kömekçi',aiCode:'Elýeterlilik kody',aiUrl:'Netlify saýtyň salgysy (https://…netlify.app)',aiQ:'AI üçin sorag ýa-da tabşyryk…',aiA:'AI jogaby şu ýerde peýda bolar',ask:'Sora',aiLesson:'✨ AI',aiSetup:'Saýtyň salgysyny we kody giriziň.',aiErr:'AI ýalňyşlygy:',
loading:'Ýüklenýär…',offline:'Ulgam ýok we saklanan nusga ýok.',next_:'Indiki',linkName:'Baglanyşygyň ady',linkUrl:'Salgy (https://…)',
names:['Daň','Gün','Öýle','Ikindi','Agşam','Ýatsy']}
};
let lang=g('hub_lang')||'ru', ai=0;
const t=k=>T[lang][k];

function applyLang(){
  document.documentElement.lang=lang==='tk'?'tk':'ru';
  $('hello').textContent=t('hello');
  document.querySelectorAll('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));
  document.querySelectorAll('[data-p]').forEach(e=>e.placeholder=t(e.dataset.p));
  $('bru').classList.toggle('on',lang==='ru');$('btk').classList.toggle('on',lang==='tk');
  renderTimer();renderPrayer();
}
document.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{lang=b.dataset.l;s('hub_lang',lang);applyLang()});

// ---- Тема ----
function setTheme(d){document.body.classList.toggle('dark',d);$('thm').textContent=d?'☀️':'🌙'}
const st=g('hub_theme');
setTheme(st?st==='dark':matchMedia('(prefers-color-scheme: dark)').matches);
$('thm').onclick=()=>{const d=!document.body.classList.contains('dark');setTheme(d);s('hub_theme',d?'dark':'light')};

// ---- Поля ----
$('shift').value=g('hub_shift')||'';$('shift').oninput=e=>s('hub_shift',e.target.value);
$('nt').value=g('hub_notes')||'';$('nt').oninput=e=>s('hub_notes',e.target.value);

// ---- Заметки: экспорт/импорт ----
$('ex').onclick=()=>{
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([$('nt').value],{type:'text/plain;charset=utf-8'}));
  a.download='yusup-notes.txt';document.body.appendChild(a);a.click();a.remove();
};
$('im').onclick=()=>$('fi').click();
$('fi').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  f.text().then(x=>{$('nt').value=x;s('hub_notes',x)});e.target.value='';
};

// ---- Таймер (Pomodoro 25/5, переживает перезагрузку) ----
let ts=null; // {mode:'work'|'rest', end:ms}
try{ts=JSON.parse(g('hub_timer'))}catch(e){}
let iv=null;
const pad=n=>String(n).padStart(2,'0');
function renderTimer(){
  const mode=ts?ts.mode:'work';
  $('fmode').textContent=t(mode);
  $('fb').textContent=ts?t('stop'):t('start');
  const rem=ts?Math.max(0,Math.ceil((ts.end-Date.now())/1000)):WORK;
  $('ft').textContent=pad(Math.floor(rem/60))+':'+pad(rem%60);
}
function tick(){
  if(ts&&Date.now()>=ts.end){
    const was=ts.mode;
    if(navigator.vibrate)navigator.vibrate([300,120,300]);
    ts={mode:was==='work'?'rest':'work',end:Date.now()+(was==='work'?REST:WORK)*1000};
    s('hub_timer',JSON.stringify(ts));
    $('fmode').textContent=t('done');
  }
  renderTimer();
}
function runTimer(){clearInterval(iv);iv=setInterval(tick,500)}
$('fb').onclick=()=>{
  if(ts){ts=null;s('hub_timer','null');clearInterval(iv)}
  else{ts={mode:'work',end:Date.now()+WORK*1000};s('hub_timer',JSON.stringify(ts));runTimer()}
  renderTimer();
};
if(ts)runTimer();
document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()});

// ---- Намаз (Aladhan API, кэш по дате) ----
let pdata=null;
function dateKey(){const d=new Date();return pad(d.getDate())+'-'+pad(d.getMonth()+1)+'-'+d.getFullYear()}
async function loadPrayer(){
  const key='hub_pt_'+dateKey();
  try{pdata=JSON.parse(g(key))}catch(e){}
  if(!pdata){
    try{
      const u=`https://api.aladhan.com/v1/timings/${dateKey()}?latitude=${LAT}&longitude=${LON}&method=${METHOD}&school=${SCHOOL}&timezonestring=${TZ}`;
      const r=await fetch(u);const j=await r.json();
      pdata=j.data.timings;s(key,JSON.stringify(pdata));
    }catch(e){}
  }
  renderPrayer();
}
function renderPrayer(){
  const box=$('pt');box.textContent='';
  if(!pdata){$('pinfo').textContent='Туркменабат · '+(navigator.onLine?t('loading'):t('offline'));return}
  $('pinfo').textContent='Туркменабат · '+dateKey().replace(/-/g,'.');
  const keys=['Fajr','Sunrise','Dhuhr','Asr','Maghrib','Isha'];
  const now=new Date(new Date().toLocaleString('en-US',{timeZone:TZ}));
  const nm=now.getHours()*60+now.getMinutes();
  let next=keys.findIndex(k=>{const[h,m]=pdata[k].split(':');return +h*60+ +m>nm});
  if(next<0)next=0;
  keys.forEach((k,i)=>{
    const d=document.createElement('div');if(i===next)d.className='nx';
    const b=document.createElement('b');b.textContent=pdata[k].slice(0,5);
    d.append(b,t('names')[i]);box.append(d);
  });
}
loadPrayer();setInterval(renderPrayer,60000);

// ---- Аят дня (текст и перевод из alquran.cloud, кэш) ----
function ayIndex(){
  const day=Math.floor(Date.now()/86400000);
  return (day+ai)%AYAT.length;
}
async function loadAyah(){
  const ref=AYAT[ayIndex()],[sura,num]=ref.split(':');
  $('ref').textContent=`${sura}:${num}`;
  $('tf').href=`https://quran.com/${sura}:${num}/tafsirs`;
  $('an').value=g('hub_an_'+ref)||'';$('an').oninput=e=>s('hub_an_'+ref,e.target.value);
  let d=null;
  try{d=JSON.parse(g('hub_ay_'+ref))}catch(e){}
  if(!d){
    $('ar').textContent='';$('tr').textContent=t('loading');
    try{
      const r=await fetch(`https://api.alquran.cloud/v1/ayah/${ref}/editions/quran-uthmani,ru.kuliev`);
      const j=await r.json();
      d={ar:j.data[0].text,ru:j.data[1].text,name:j.data[1].surah.name};
      s('hub_ay_'+ref,JSON.stringify(d));
    }catch(e){$('tr').textContent=t('offline');return}
  }
  $('ar').textContent=d.ar;$('tr').textContent=d.ru;
}
$('nx').onclick=()=>{ai++;loadAyah()};

// ---- Конспект урока ----
['ls','lc','lt','lg','lm','lo'].forEach(id=>{
  const e=$(id);e.value=g('hub_'+id)||(id==='lm'?'45':'');e.oninput=()=>s('hub_'+id,e.value);
});
const val=id=>$(id).value.trim()||'________';
function mins(){
  const m=Math.min(120,Math.max(10,+$('lm').value||45)),a=[.07,.15,.45,.22].map(x=>Math.round(m*x));
  a.push(m-a.reduce((p,c)=>p+c,0));return{m,a};
}
function lessonText(){
  const{m,a}=mins();
  return [t('lhead'),'',`${t('lsubj')}: ${val('ls')}`,`${t('lclass')}: ${val('lc')}`,`${t('ltopic')}: ${val('lt')}`,`${t('lmin')}: ${m}`,'',
    `${t('lgoalL')}: ${val('lg')}`,`${t('ltasks')}: ________`,`${t('lequip')}: ________`,'',t('lcourse')+':',
    ...t('stages').map((n,i)=>`${i+1}. ${n} (${a[i]} ${t('lmin_')})\n   ________`)].join('\n');
}
function aiPromptText(){
  const{m,a}=mins();
  return [t('pin'),`${t('lsubj')}: ${val('ls')}`,`${t('lclass')}: ${val('lc')}`,`${t('ltopic')}: ${val('lt')}`,`${t('lgoalL')}: ${val('lg')}`,`${t('lmin')}: ${m}`,
    t('lcourse')+': '+t('stages').map((n,i)=>`${n} (${a[i]} ${t('lmin_')})`).join('; ')+'.',t('pout')].join('\n');
}
$('lb').onclick=()=>{const x=lessonText();$('lo').value=x;s('hub_lo',x)};
$('lp').onclick=async()=>{
  const x=aiPromptText();
  try{await navigator.clipboard.writeText(x);$('lp').textContent=t('copied');setTimeout(()=>$('lp').textContent=t('aiPrompt'),1500)}
  catch(e){prompt('',x)}
};
$('lx').onclick=()=>{
  const a=document.createElement('a');

// ---- Todoist ----
const TD='https://api.todoist.com/api/v1';
async function tdLoad(){
  const tok=g('hub_tok');
  $('tsetup').hidden=!!tok;$('tview').hidden=!tok;
  if(!tok)return;
  $('tmsg').textContent=t('loading');
  try{
    const r=await fetch(TD+'/tasks/filter?query='+encodeURIComponent('today | overdue'),{headers:{Authorization:'Bearer '+tok}});
    if(!r.ok)throw 0;
    const j=await r.json(),list=j.results||j.tasks||(Array.isArray(j)?j:[]);
    const box=$('tl');box.textContent='';
    list.forEach(x=>{
      const row=document.createElement('label');row.className='tk';
      const c=document.createElement('input');c.type='checkbox';
      c.onchange=async()=>{
        try{const q=await fetch(`${TD}/tasks/${x.id}/close`,{method:'POST',headers:{Authorization:'Bearer '+tok}});if(!q.ok)throw 0;row.remove()}
        catch(e){c.checked=false;$('tmsg').textContent=t('todoErr')}
      };
      const sp=document.createElement('span');sp.textContent=x.content;
      row.append(c,sp);box.append(row);
    });
    $('tmsg').textContent=list.length?'':t('noTasks');
  }catch(e){$('tmsg').textContent=t('todoErr')}
}
$('tsave').onclick=()=>{const v=$('tok').value.trim();if(!v)return;s('hub_tok',v);$('tok').value='';tdLoad()};
$('tch').onclick=()=>{try{localStorage.removeItem('hub_tok')}catch(e){}$('tl').textContent='';$('tmsg').textContent='';tdLoad()};
$('tref').onclick=tdLoad;

// ---- MacroDroid (Webhook-триггеры) ----
$('dev').value=g('hub_dev')||'';$('dev').oninput=e=>s('hub_dev',e.target.value.trim());
let mbs=[];try{mbs=JSON.parse(g('hub_mb'))||[]}catch(e){}
function saveMb(){s('hub_mb',JSON.stringify(mbs));renderMb()}
function renderMb(){
  const box=$('mb');box.textContent='';
  mbs.forEach((m,i)=>{
    const b=document.createElement('button');b.className='b';b.textContent=m.n;
    const flash=x=>{b.textContent=x;setTimeout(()=>b.textContent=m.n,1500)};
    b.onclick=async()=>{
      const d=g('hub_dev');if(!d){flash('ID?');return}
      try{await fetch(`https://trigger.macrodroid.com/${encodeURIComponent(d)}/${encodeURIComponent(m.id)}`,{mode:'no-cors'});flash(t('sent'))}
      catch(e){flash('✕')}
    };
    b.oncontextmenu=e=>{e.preventDefault();if(confirm('✕ '+m.n+'?')){mbs.splice(i,1);saveMb()}};
    box.append(b);
  });
}
$('mad').onclick=()=>{
  const n=prompt(t('btnName'));if(!n)return;
  const id=prompt(t('btnId'));if(!id)return;
  mbs.push({n:n.slice(0,24),id:id.trim()});saveMb();
};

// ---- ИИ-помощник (через Netlify Function) ----
['aip','aic','aiu','aiq','aia'].forEach(id=>{
  const e=$(id);
  e.value=g('hub_'+id)||(id==='aiu'&&/netlify\.app$/.test(location.hostname)?location.origin:'');
  e.oninput=e.onchange=()=>s('hub_'+id,e.value);
});
async function askAI(prompt,target,btn){
  const base=$('aiu').value.trim().replace(/\/$/,''),code=$('aic').value;
  if(!prompt)return;
  if(!base||!code){alert(t('aiSetup'));return}
  btn.disabled=true;btn.textContent=t('loading');
  try{
    const r=await fetch(base+'/api/ai',{method:'POST',headers:{'Content-Type':'application/json','X-Access-Code':code},body:JSON.stringify({provider:$('aip').value,prompt})});
    const j=await r.json();
    if(!r.ok)throw new Error(j.error||r.status);
    target.value=j.text;s('hub_'+target.id,j.text);
  }catch(e){alert(t('aiErr')+' '+e.message)}
  btn.disabled=false;btn.textContent=t(btn.dataset.i);
}
$('aib').onclick=()=>askAI($('aiq').value.trim(),$('aia'),$('aib'));
$('lai').onclick=()=>askAI(aiPromptText(),$('lo'),$('lai'));
