<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f4f7fc" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d1322" media="(prefers-color-scheme: dark)">
<title>Теория игр</title>
<style>
:root{--bg:#f4f7fc;--card:#ffffff;--ink:#14213d;--mute:#56647e;--acc:#1f5fd6;--hi:#ffd84d;--hiink:#14213d;--line:#d9e0ee;--sh:0 1px 2px rgba(20,33,61,.06),0 10px 24px -14px rgba(20,33,61,.22);color-scheme:light}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--bg:#0d1322;--card:#161e34;--ink:#e9edf6;--mute:#9ba8c4;--acc:#7fb0ff;--hi:#ffd84d;--hiink:#14213d;--line:#27314f;--sh:0 0 0 rgba(0,0,0,0);color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#0d1322;--card:#161e34;--ink:#e9edf6;--mute:#9ba8c4;--acc:#7fb0ff;--hi:#ffd84d;--hiink:#14213d;--line:#27314f;--sh:0 0 0 rgba(0,0,0,0);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;padding-bottom:env(safe-area-inset-bottom,0px);touch-action:manipulation}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 12px;display:flex;align-items:center;gap:10px}
header div{flex:1;min-width:0}
h1{margin:0;font-size:1.3rem;line-height:1.2;letter-spacing:-.01em}
header p{margin:2px 0 0;font-size:.85rem;color:var(--mute)}
.btn{min-width:52px;height:52px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;font:inherit;font-size:1rem;font-weight:650;cursor:pointer;padding:0 16px;transition:transform .12s ease,background-color .2s ease,border-color .2s ease}
.btn:active{transform:scale(.96)}
.btn.p{background:var(--acc);border-color:var(--acc);color:#fff}
:root[data-theme="dark"] .btn.p{color:#0d1322}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.p{color:#0d1322}}
.btn:focus-visible,summary:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
main{max-width:640px;margin:0 auto;padding:8px 16px 40px}
h2{font-size:1.15rem;margin:30px 0 12px;display:flex;align-items:center;gap:10px;letter-spacing:-.01em}
h2::before{content:"";width:6px;height:1.1em;border-radius:3px;background:var(--hi)}
.idea{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--hi);border-radius:6px 16px 16px 6px;padding:16px 18px;font-size:1.08rem;box-shadow:var(--sh)}
details{background:var(--card);border:1px solid var(--line);border-radius:16px;margin:0 0 12px;box-shadow:var(--sh);overflow:hidden}
summary{cursor:pointer;padding:16px 18px;min-height:58px;font-weight:650;list-style:none;display:flex;justify-content:space-between;gap:12px;align-items:center}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";color:var(--acc);font-size:1.6rem;line-height:1;transition:transform .2s ease}
details[open]>summary::after{transform:rotate(45deg)}
.body{padding:0 18px 16px}
details[open] .body{animation:down .24s ease}
.body p{margin:0 0 10px}
.grid{width:100%;border-collapse:separate;border-spacing:0;text-align:center;font-size:.95rem;margin:8px 0 6px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.grid th,.grid td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:14px 6px}
.grid tr>*:last-child{border-right:0}
.grid tr:last-child>*{border-bottom:0}
.grid th{color:var(--mute);font-weight:600}
.grid td{font-weight:750;font-size:1.15rem}
.grid td.nash{background:var(--hi);color:var(--hiink)}
.cap{font-size:.88rem;color:var(--mute);margin:0 0 10px}
.ans{background:var(--bg);border-radius:12px;padding:12px 14px;margin:0}
.game{background:var(--card);border:1px solid var(--line);border-top:5px solid var(--acc);border-radius:16px;padding:18px;box-shadow:var(--sh)}
.game .rule{font-size:.92rem;color:var(--mute);margin:0 0 6px}
.score{font-size:2.1rem;font-weight:800;text-align:center;color:var(--acc);margin:8px 0;font-variant-numeric:tabular-nums}
.score.pop{animation:pop .3s ease}
.game .msg{margin:0 0 14px;min-height:3.4em}
.row{display:flex;gap:12px}
.row .btn{flex:1}
.game .row .btn{height:68px;font-size:1.08rem;border-radius:16px}
footer{text-align:center;color:var(--mute);font-size:.82rem;padding:8px 16px 32px}
[hidden]{display:none!important}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes down{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.12)}100%{transform:scale(1)}}
main.fx>*{animation:up .5s ease both;animation-delay:calc(var(--i,0)*55ms)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header>
  <div><h1 id="t"></h1><p id="s"></p></div>
  <button class="btn" id="bl" type="button"></button>
  <button class="btn" id="bt" type="button">&#9680;</button>
</header>
<main id="app"></main>
<footer id="f"></footer>
<script>
var D = {
  ru: {
    t: "Теория игр", s: "Конспект и игра для школьников", lang: "Сменить язык", theme: "Сменить тему",
    idea: "Главная мысль",
    ideaT: "Теория игр изучает ситуации, где результат зависит не только от твоего выбора, но и от выбора других. Думай не только «что сделаю я», но и «что сделают они».",
    play: "Сыграй с компьютером",
    rule: "6 раундов, оба выбирают одновременно. Оба делятся: по 3 очка. Оба забирают: по 1. Один забирает, другой делится: 5 и 0.",
    share: "Делиться", take: "Забрать", again: "Сыграть ещё раз", round: "Раунд", you: "Ты", pc: "ПК",
    last: "Прошлый раунд:", did: "делился", took: "забрал", end: "Игра окончена.",
    hint: "ПК играл «око за око»: в первом раунде делился, потом повторял твой прошлый ход. Это пример повторяющейся игры. Попробуй всегда делиться и сравни результат. А что выгоднее в последнем раунде? Подумай.",
    defs: "Определения",
    d: [
      ["Игра", "Любая ситуация, где несколько участников принимают решения и влияют друг на друга."],
      ["Стратегия", "План действий игрока."],
      ["Выигрыш", "То, что игрок получает в итоге: очки, деньги, оценку, спокойствие."],
      ["Доминирующая стратегия", "Вариант, который выгоднее при любых действиях соперника."],
      ["Равновесие Нэша", "Ситуация, где никому не выгодно менять свой выбор в одиночку. Названо в честь математика Джона Нэша."],
      ["Игра с нулевой суммой", "Выигрыш одного равен проигрышу другого (шахматы)."],
      ["Игра с ненулевой суммой", "Выиграть могут все вместе (торговля, дружба, общая работа)."]
    ],
    ex: "Примеры",
    e: [
      ["Дилемма заключённого", "Двое друзей разбили окно, учитель спрашивает каждого отдельно. Оба молчат: по 1 замечанию. Оба сдают друг друга: по 3. Один сдаёт, другой молчит: 0 и 5. Каждому по отдельности выгоднее сдать, поэтому оба получают по 3, хотя молчание дало бы по 1. Вывод: личная выгода каждого может привести к плохому итогу для всех."],
      ["Камень, ножницы, бумага", "Лучшей стратегии нет. Предсказуемого игрока обыгрывают, поэтому выгодно выбирать случайно, примерно по трети на каждый вариант."],
      ["Два магазина рядом", "Оба снижают цены, чтобы забрать покупателей, и оба зарабатывают меньше. Выход: соревноваться качеством и сервисом, а не только ценой."],
      ["«Цыплёнок»", "Два водителя едут навстречу друг другу. Кто свернёт, тот «трус», а если не свернёт никто, будет авария. Выигрывает тот, кто убедительно показал, что не свернёт, но это очень рискованно. Лучше не доводить до такого."],
      ["Повторяющиеся игры", "Если игра повторяется много раз, выгоднее сотрудничать. Хорошо работает «око за око»: в первый раз доверяй, потом повторяй ход партнёра."]
    ],
    pay: { cap: "Замечания: сначала у тебя, потом у друга. Меньше значит лучше.", r: ["Я молчу", "Я сдаю"], c: ["Друг молчит", "Друг сдаёт"], v: [["1 и 1", "5 и 0"], ["0 и 5", "3 и 3"]], nash: "Равновесие Нэша" },
    quiz: "Проверь себя",
    q: [
      ["Что изучает теория игр?", "Принятие решений, когда результат зависит от выбора других. Игра здесь означает любую такую ситуацию."],
      ["Объясни своими словами, что такое равновесие Нэша.", "Ситуация, где никому не выгодно менять выбор в одиночку."],
      ["Почему в дилемме заключённого оба выбирают «сдать», хотя молчать выгоднее?", "Сдать выгоднее при любом выборе друга, поэтому оба так и делают."],
      ["Чем игра с нулевой суммой отличается от игры с ненулевой? Приведи примеры.", "Нулевая сумма: выигрыш одного равен проигрышу другого (шахматы). Ненулевая: можно выиграть вместе (торговля)."],
      ["Почему в повторяющихся играх сотрудничество выгоднее?", "Партнёр запомнит обман и накажет в следующий раз, а доверие приносит выгоду в долгую."]
    ],
    foot: "Конспект по теме «Теория игр»"
  },
  tk: {
    t: "Oýunlar nazaryýeti", s: "Okuwçylar üçin konspekt we oýun", lang: "Dili üýtget", theme: "Temany üýtget",
    idea: "Esasy pikir",
    ideaT: "Oýunlar nazaryýeti netijäniň diňe seniň saýlawyňa däl, eýsem başgalaryň saýlawyna hem bagly bolan ýagdaýlaryny öwrenýär. Diňe «men näme ederin» diýip däl, «olar näme eder» diýip hem pikir et.",
    play: "Kompýuter bilen oýna",
    rule: "6 tegelek, ikisi hem bir wagtda saýlaýar. Ikisi hem paýlaşsa: 3-den bal. Ikisi hem alsa: 1-den. Biri alsa, beýlekisi paýlaşsa: 5 we 0.",
    share: "Paýlaş", take: "Al", again: "Ýene bir gezek oýna", round: "Tegelek", you: "Sen", pc: "KP",
    last: "Öňki tegelek:", did: "paýlaşdy", took: "aldy", end: "Oýun gutardy.",
    hint: "KP «göze göz» strategiýasy bilen oýnady: birinji tegelekde paýlaşdy, soň seniň öňki hereketiňi gaýtalady. Bu gaýtalanýan oýunyň mysaly. Hemişe paýlaşyp görüp, netijäni deňeşdir. Soňky tegelekde näme peýdaly? Pikir et.",
    defs: "Düşünjeler",
    d: [
      ["Oýun", "Birnäçe gatnaşyjynyň karar kabul edip, biri-birine täsir edýän islendik ýagdaýy."],
      ["Strategiýa", "Oýunçynyň hereketler meýilnamasy."],
      ["Utuş", "Oýunçynyň netijede alýan zady: bal, pul, baha, rahatlyk."],
      ["Agdyklyk edýän strategiýa", "Garşydaşyň hereketlerine garamazdan has peýdaly bolan warianty."],
      ["Neşiň deňagramlylygy", "Hiç kimiň ýeke özi saýlawyny üýtgetmeginiň peýdaly bolmadyk ýagdaýy. Matematik Jon Neşiň hormatyna şeýle atlandyrylýar."],
      ["Nol jemli oýun", "Biriniň utuşy beýleki biriniň ýitgisine deň (şatranç)."],
      ["Nol däl jemli oýun", "Hemmeler bilelikde utup biler (söwda, dostluk, bilelikdäki iş)."]
    ],
    ex: "Mysallar",
    e: [
      ["Tussagyň dilemmasy", "Iki dost äýnegi döwdi, mugallym her birinden aýratyn soraýar. Ikisi hem dymsa: 1-den duýduryş. Ikisi hem biri-birini satsa: 3-den. Biri satyp, beýlekisi dymsa: 0 we 5. Her biri üçin satmak peýdaly, şonuň üçin ikisi hem 3 alýar, dymmak bolsa 1-den berjekdi. Netije: her kimiň şahsy peýdasy hemmeler üçin erbet netijä getirip biler."],
      ["Daş, gaýçy, kagyz", "Iň oňat strategiýa ýok. Çaklanyp bolýan oýunçy utulýar, şonuň üçin tötänleýin saýlamak peýdaly, her warianty takmynan üçden birine."],
      ["Ýanaşyk iki dükan", "Ikisi hem alyjylary çekmek üçin bahany peseldýär we az gazanýar. Çykalga: diňe bahada däl, hilde we hyzmatda bäsleşmek."],
      ["«Jüýje» oýny", "Iki sürüji garşy-garşy gelýär. Kim sowulsa, şol «gorkak», hiç kim sowulmasa, awariýa bolýar. Kim sowulmajakdygyny ynandyryjy görkezse, şol utýar, ýöne bu örän töwekgelçilikli. Munuň ýaly ýagdaýa ýetirmezlik has gowy."],
      ["Gaýtalanýan oýunlar", "Oýun köp gezek gaýtalanýan bolsa, hyzmatdaşlyk has peýdaly. «Göze göz» gowy işleýär: ilkinji gezek ynan, soňra hyzmatdaşyň hereketini gaýtala."]
    ],
    pay: { cap: "Duýduryşlar: ilki seniň, soň dostuň. Näçe az bolsa, şonça gowy.", r: ["Men dymýaryn", "Men satýaryn"], c: ["Dost dymýar", "Dost satýar"], v: [["1 we 1", "5 we 0"], ["0 we 5", "3 we 3"]], nash: "Neşiň deňagramlylygy" },
    quiz: "Özüňi barla",
    q: [
      ["Oýunlar nazaryýeti näme öwrenýär?", "Netijäniň başgalaryň saýlawyna hem bagly bolan karar kabul etmegini. Bu ýerde oýun şeýle islendik ýagdaý diýmekdir."],
      ["Neşiň deňagramlylygyny öz sözleriň bilen düşündir.", "Hiç kimiň ýeke özi saýlawyny üýtgetmegi peýdaly bolmadyk ýagdaý."],
      ["Tussagyň dilemmasynda dymmak peýdaly bolsa-da, näme üçin ikisi hem «satýar»?", "Dostuň saýlawyna garamazdan satmak peýdaly, şonuň üçin ikisi hem şeýle edýär."],
      ["Nol jemli oýun nol däl jemli oýundan nämesi bilen tapawutlanýar? Mysal getir.", "Nol jemlide biriniň utuşy beýlekiniň ýitgisi (şatranç). Nol däl jemlide bilelikde utup bolýar (söwda)."],
      ["Gaýtalanýan oýunlarda hyzmatdaşlyk näme üçin peýdaly?", "Hyzmatdaş aldawy ýatda saklaýar we indiki gezek jezalandyrýar, ynam bolsa uzak möhletde peýda berýär."]
    ],
    foot: "«Oýunlar nazaryýeti» temasy boýunça konspekt"
  }
};

var lang = "ru";
try { var sl = localStorage.getItem("gt-lang"); if (sl === "ru" || sl === "tk") lang = sl; } catch (e) {}
try { var st = localStorage.getItem("gt-theme"); if (st === "light" || st === "dark") document.documentElement.setAttribute("data-theme", st); } catch (e) {}

var G = { r: 0, y: 0, p: 0, ly: "", lp: "" };

function effectiveTheme() {
  var a = document.documentElement.getAttribute("data-theme");
  if (a) return a;
  return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
}

function gname(c) { return D[lang][c === "s" ? "did" : "took"]; }

function renderGame() {
  var L = D[lang], done = G.r >= 6;
  document.getElementById("gs").textContent = L.you + " " + G.y + " : " + G.p + " " + L.pc;
  var m = done ? L.end + " " + L.hint :
    (G.r ? L.last + " " + L.you + ": " + gname(G.ly) + ", " + L.pc + ": " + gname(G.lp) + ". " : "") + L.round + " " + (G.r + 1) + "/6";
  document.getElementById("gm").textContent = m;
  document.getElementById("gb").hidden = done;
  document.getElementById("ga").hidden = !done;
}

function pulse() {
  var e = document.getElementById("gs");
  e.classList.remove("pop"); void e.offsetWidth; e.classList.add("pop");
  try { if (navigator.vibrate) navigator.vibrate(12); } catch (x) {}
}

function play(c) {
  if (G.r >= 6) return;
  var p = G.r === 0 ? "s" : G.ly;
  var pts = { ss: [3, 3], tt: [1, 1], ts: [5, 0], st: [0, 5] }[c + p];
  G.y += pts[0]; G.p += pts[1]; G.ly = c; G.lp = p; G.r++;
  renderGame();
  pulse();
}

function render() {
  var L = D[lang], h = "", i, p = L.pay;
  document.documentElement.lang = lang;
  document.title = L.t;
  document.getElementById("t").textContent = L.t;
  document.getElementById("s").textContent = L.s;
  document.getElementById("f").textContent = L.foot;
  var bl = document.getElementById("bl");
  bl.textContent = lang === "ru" ? "TM" : "RU";
  bl.setAttribute("aria-label", L.lang);
  document.getElementById("bt").setAttribute("aria-label", L.theme);

  h += "<h2>" + L.idea + "</h2><div class=\"idea\">" + L.ideaT + "</div>";

  h += "<h2>" + L.play + "</h2><div class=\"game\"><p class=\"rule\">" + L.rule + "</p>" +
    "<div class=\"score\" id=\"gs\"></div><p class=\"msg\" id=\"gm\" aria-live=\"polite\"></p>" +
    "<div class=\"row\" id=\"gb\"><button class=\"btn p\" id=\"gh\" type=\"button\">\uD83E\uDD1D " + L.share + "</button>" +
    "<button class=\"btn\" id=\"gt\" type=\"button\">\u270B " + L.take + "</button></div>" +
    "<div class=\"row\" id=\"ga\" hidden><button class=\"btn p\" id=\"gr\" type=\"button\">" + L.again + "</button></div></div>";

  h += "<h2>" + L.defs + "</h2>";
  for (i = 0; i < L.d.length; i++) {
    h += "<details><summary>" + L.d[i][0] + "</summary><div class=\"body\"><p>" + L.d[i][1] + "</p></div></details>";
  }

  h += "<h2>" + L.ex + "</h2>";
  for (i = 0; i < L.e.length; i++) {
    h += "<details" + (i === 0 ? " open" : "") + "><summary>" + L.e[i][0] + "</summary><div class=\"body\"><p>" + L.e[i][1] + "</p>";
    if (i === 0) {
      h += "<table class=\"grid\"><tr><th></th><th>" + p.c[0] + "</th><th>" + p.c[1] + "</th></tr>";
      for (var r = 0; r < 2; r++) {
        h += "<tr><th>" + p.r[r] + "</th>";
        for (var c = 0; c < 2; c++) {
          h += "<td" + (r === 1 && c === 1 ? " class=\"nash\"" : "") + ">" + p.v[r][c] + "</td>";
        }
        h += "</tr>";
      }
      h += "</table><p class=\"cap\">" + p.cap + " " + p.nash + ": " + p.v[1][1] + ".</p>";
    }
    h += "</div></details>";
  }

  h += "<h2>" + L.quiz + "</h2>";
  for (i = 0; i < L.q.length; i++) {
    h += "<details><summary>" + (i + 1) + ". " + L.q[i][0] + "</summary><div class=\"body\"><p class=\"ans\">" + L.q[i][1] + "</p></div></details>";
  }
  var app = document.getElementById("app"), was = [].map.call(app.querySelectorAll("details"), function (d) { return d.open; });
  app.innerHTML = h;
  var ds = app.querySelectorAll("details");
  if (was.length === ds.length) for (var k = 0; k < ds.length; k++) ds[k].open = was[k];
  if (!app.classList.contains("seen")) {
    app.classList.add("seen", "fx");
    [].forEach.call(app.children, function (el, n) { el.style.setProperty("--i", Math.min(n, 8)); });
    setTimeout(function () { app.classList.remove("fx"); }, 1200);
  }

  document.getElementById("gh").onclick = function () { play("s"); };
  document.getElementById("gt").onclick = function () { play("t"); };
  document.getElementById("gr").onclick = function () { G = { r: 0, y: 0, p: 0, ly: "", lp: "" }; renderGame(); };
  renderGame();
}

document.getElementById("bl").addEventListener("click", function () {
  lang = lang === "ru" ? "tk" : "ru";
  try { localStorage.setItem("gt-lang", lang); } catch (e) {}
  render();
});
document.getElementById("bt").addEventListener("click", function () {
  var n = effectiveTheme() === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", n);
  try { localStorage.setItem("gt-theme", n); } catch (e) {}
});
render();
</script>
</body>
</html>
